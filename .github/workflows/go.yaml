name: Testing
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    # TESTER: required to run in the docker network so that the generated NATS instances are reachable
    container: golang:alpine
    strategy:
      matrix:
        go: [ "1.25", "1.26" ]

    services:
      # TESTER: the tester server
      nats:
        image: synadia/server-tester:2.14.0
        options: --name nats   # only needed to facilitate debugging with docker logs etc

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}

      - name: Install deps
        run: |
          export GOPATH="$RUNNER_WORKSPACE"
          go version
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/client9/misspell/cmd/misspell@latest

      - name: Lint
        run: |
          export GOPATH="$RUNNER_WORKSPACE"
          PATH=$PATH:$GOPATH/bin
          $(exit $(go fmt $(go list ./...) | wc -l))
          find . -type f -name "*.go" | xargs misspell -error -locale US
          staticcheck -f stylish $(go list ./... )
          go vet ./...

      - name: Run tests
        run: |
          export GOPATH="$RUNNER_WORKSPACE"
          export TESTER_NATS_URL="nats://nats:4222"
          
          export CGO_ENABLED=1 # needed for -race below
          
          # for -race 
          apk add gcc libc-dev docker
          
          go test -v -race -p 1 ./...
